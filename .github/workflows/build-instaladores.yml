name: Gerar instaladores (APK, IPA, Windows e Web)

# Gera APK (Android), IPA (iOS), o instalador do Windows (desktop) e a versão web (pronta para publicar online).
# Roda manualmente (aba Actions > "Run workflow") ou ao criar uma tag v* (ex.: v1.0.0).
# Com tag, os instaladores também são anexados a uma Release do GitHub.
on:
  workflow_dispatch:
    inputs:
      ios_export_method:
        description: 'Tipo de IPA assinado (só se houver certificados iOS nos Secrets)'
        type: choice
        options: [ad-hoc, app-store, development]
        default: ad-hoc
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar código (tipos e lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checar tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint

  web:
    name: Web (site estático)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versão do app
        id: versao
        run: echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
      - name: Gerar versão web
        run: npx expo export --platform web --output-dir dist-web
        env:
          CI: 1
      - name: Compactar
        run: cd dist-web && zip -qr "../imobiliario-ml-${{ steps.versao.outputs.v }}-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: imobiliario-ml-*-web.zip
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Versão do app
        id: versao
        run: echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Preparar keystore de produção (opcional)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Gerar projeto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar APK release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/imobiliario-ml-${{ steps.versao.outputs.v }}.apk"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::APK assinado com chave de DEBUG (instala normalmente, mas não serve para a Play Store). Configure os secrets ANDROID_* para usar sua keystore."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS (IPA)
    needs: verificar
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      P12_B64: ${{ secrets.IOS_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      EXPORT_METHOD: ${{ inputs.ios_export_method || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Versão do app
        id: versao
        run: echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Gerar projeto nativo (expo prebuild)
        run: npx expo prebuild --platform ios --no-install
        env:
          CI: 1

      - name: Instalar Pods
        working-directory: ios
        run: pod install

      - name: Localizar workspace e scheme
        id: proj
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WS | Scheme: $SCHEME"

      # ---------- Caminho 1: IPA ASSINADO (quando os secrets iOS existem) ----------
      - name: Instalar certificado e perfil de provisionamento
        if: env.P12_B64 != '' && env.PROFILE_B64 != '' && env.TEAM_ID != ''
        id: assinatura
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          # Xcode 16+ também procura aqui
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "bundle=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Perfil: $UUID | Identidade: $IDENTITY"

      - name: Aplicar assinatura manual só no alvo do app
        if: steps.assinatura.outcome == 'success'
        working-directory: ios
        env:
          UUID: ${{ steps.assinatura.outputs.uuid }}
          IDENTITY: ${{ steps.assinatura.outputs.identity }}
          BUNDLE_ID: ${{ steps.assinatura.outputs.bundle }}
        run: |
          PBX=$(ls -d *.xcodeproj | head -1)/project.pbxproj
          # Remove configurações automáticas e injeta as manuais nas configs do app (Debug/Release)
          sed -i '' -e '/CODE_SIGN_STYLE = /d' -e '/DEVELOPMENT_TEAM = /d' -e '/PROVISIONING_PROFILE_SPECIFIER = /d' -e '/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = /d' "$PBX"
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;|PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID; CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$UUID\"; \"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"$IDENTITY\";|g" "$PBX"
          grep -c "PROVISIONING_PROFILE_SPECIFIER" "$PBX"

      - name: Arquivar e exportar IPA assinado
        if: steps.assinatura.outcome == 'success'
        working-directory: ios
        env:
          UUID: ${{ steps.assinatura.outputs.uuid }}
          BUNDLE_ID: ${{ steps.assinatura.outputs.bundle }}
        run: |
          xcodebuild -workspace "${{ steps.proj.outputs.workspace }}" \
            -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${UUID}</string></dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mkdir -p ../dist
          cp "$RUNNER_TEMP"/export/*.ipa "../dist/imobiliario-ml-${{ steps.versao.outputs.v }}-${EXPORT_METHOD}.ipa"

      # ---------- Caminho 2: IPA SEM ASSINATURA (sem secrets iOS) ----------
      - name: Compilar IPA sem assinatura
        if: steps.assinatura.outcome != 'success'
        working-directory: ios
        run: |
          xcodebuild -workspace "${{ steps.proj.outputs.workspace }}" \
            -scheme "${{ steps.proj.outputs.scheme }}" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
          APP=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/imobiliario-ml-${{ steps.versao.outputs.v }}-unsigned.ipa" Payload)
          echo "::warning::IPA gerado SEM assinatura. Para instalar no iPhone é preciso assinar (ex.: Sideloadly/AltStore) ou configurar os secrets IOS_* para gerar um IPA assinado."

      - name: Limpar keychain
        if: always() && steps.assinatura.outcome == 'success'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  desktop:
    name: Windows (instalador .exe)
    needs: verificar
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Instalar dependências do app
        run: npm ci

      - name: Versão do app
        id: versao
        shell: bash
        run: echo "v=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Gerar versão web do app
        run: npx expo export --platform web --output-dir desktop/app
        env:
          CI: 1

      - name: Instalar Electron
        working-directory: desktop
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Gerar instalador Windows
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --win nsis --publish never -c.extraMetadata.version=${{ steps.versao.outputs.v }}
          echo "::warning::Instalador Windows sem assinatura digital: o Windows pode mostrar 'O Windows protegeu o computador'. Clique em 'Mais informações' > 'Executar assim mesmo'."

      - uses: actions/upload-artifact@v4
        with:
          name: windows-instalador
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, desktop, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
