name: Publicar assistente de voz (Supabase Edge Function)

# Publica supabase/functions/imobiliario-ia no projeto Supabase sempre que a função mudar
# (ou manualmente pela aba Actions). Precisa dos secrets:
#   SUPABASE_ACCESS_TOKEN  → supabase.com > Account > Access Tokens
#   ANTHROPIC_API_KEY      → console.anthropic.com > API Keys (opcional aqui: só para gravar o segredo da função)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**']

env:
  PROJETO: eoowbybfrbmjxcjfniuu

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Secret SUPABASE_ACCESS_TOKEN não configurado: a função NÃO foi publicada. Crie o secret (supabase.com > Account > Access Tokens) e rode de novo. Veja docs/SUPABASE.md."
          exit 1

      - name: Conferir chave da Anthropic
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::Secret ANTHROPIC_API_KEY não configurado aqui. Se a chave ainda não foi gravada direto no Supabase (Edge Functions > Secrets), o assistente vai responder que falta a chave."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Gravar a chave da Anthropic na função
        if: env.ANTHROPIC_API_KEY != ''
        run: supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$PROJETO"

      - name: Publicar imobiliario-ia
        run: supabase functions deploy imobiliario-ia --project-ref "$PROJETO" --use-api
